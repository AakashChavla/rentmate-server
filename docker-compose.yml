services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-rentmate}
      POSTGRES_DB: ${DB_NAME:-rentmate}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your local environment}
    ports: ['127.0.0.1:${DB_EXPOSED_PORT:-5432}:5432']
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-rentmate} -d ${DB_NAME:-rentmate}']
      interval: 5s
      timeout: 3s
      retries: 15
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports: ['127.0.0.1:${REDIS_EXPOSED_PORT:-6379}:6379']
    volumes: [redis-data:/data]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 15
  migrate:
    build: { context: ., target: dev }
    command: yarn migration:run
    environment: &platform-env
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-rentmate}
      DB_NAME: ${DB_NAME:-rentmate}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your local environment}
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3001}
      TRUST_PROXY: 1
      LOG_LEVEL: info
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
  api:
    build: { context: ., target: dev }
    command: yarn dev
    environment: *platform-env
    depends_on:
      migrate: { condition: service_completed_successfully }
    expose: ['3000']
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 15
  proxy:
    image: nginxinc/nginx-unprivileged:1.29-alpine
    volumes: ['./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro']
    ports: ['127.0.0.1:${API_EXPOSED_PORT:-3000}:8080']
    depends_on:
      api: { condition: service_healthy }
  worker:
    build: { context: ., target: dev }
    command: yarn worker:dev
    environment: *platform-env
    depends_on:
      migrate: { condition: service_completed_successfully }
volumes:
  postgres-data:
  redis-data:
